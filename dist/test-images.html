<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片加载测试 - HESHENG</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Monaco', 'Courier New', monospace;
            background: #111;
            color: #fff;
            padding: 20px;
        }
        h1 {
            color: #C9A961;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .section {
            margin-bottom: 40px;
            padding: 20px;
            background: #222;
            border-radius: 8px;
        }
        .section h2 {
            color: #C9A961;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
        }
        .img-test {
            text-align: center;
        }
        .img-test img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #C9A961;
            background: #333;
        }
        .img-test .label {
            font-size: 10px;
            margin-top: 8px;
            color: #888;
        }
        .img-test.success .label { color: #0f0; }
        .img-test.error { border-color: #f00; }
        .img-test.error .label { color: #f00; }
        .stats {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #000;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #C9A961;
            font-size: 12px;
        }
        .stats div { margin: 5px 0; }
        .success-count { color: #0f0; }
        .error-count { color: #f00; }
    </style>
</head>
<body>
    <h1>🔍 HESHENG 图片加载诊断工具</h1>

    <div class="stats" id="stats">
        <div>总计: <span id="total">0</span></div>
        <div class="success-count">成功: <span id="success">0</span></div>
        <div class="error-count">失败: <span id="error">0</span></div>
        <div>加载中: <span id="loading">0</span></div>
    </div>

    <div class="section">
        <h2>主打产品 (Featured Products)</h2>
        <div class="grid" id="featured"></div>
    </div>

    <div class="section">
        <h2>编号产品 (1-25)</h2>
        <div class="grid" id="numbered"></div>
    </div>

    <div class="section">
        <h2>品牌Logo (Brands)</h2>
        <div class="grid" id="brands"></div>
    </div>

    <div class="section">
        <h2>其他图片 (Others)</h2>
        <div class="grid" id="others"></div>
    </div>

    <script>
        const stats = { total: 0, success: 0, error: 0, loading: 0 };

        function updateStats() {
            document.getElementById('total').textContent = stats.total;
            document.getElementById('success').textContent = stats.success;
            document.getElementById('error').textContent = stats.error;
            document.getElementById('loading').textContent = stats.loading;
        }

        function createImageTest(src, label, container) {
            stats.total++;
            stats.loading++;
            updateStats();

            const div = document.createElement('div');
            div.className = 'img-test';

            const img = document.createElement('img');
            img.src = src;
            img.alt = label;

            const labelEl = document.createElement('div');
            labelEl.className = 'label';
            labelEl.textContent = label;

            img.onload = () => {
                stats.success++;
                stats.loading--;
                div.classList.add('success');
                console.log('✅ 加载成功:', src);
                updateStats();
            };

            img.onerror = () => {
                stats.error++;
                stats.loading--;
                div.classList.add('error');
                labelEl.textContent = label + ' ❌';
                console.error('❌ 加载失败:', src);
                updateStats();
            };

            div.appendChild(img);
            div.appendChild(labelEl);
            container.appendChild(div);
        }

        // Featured Products
        const featured = ['f1-horn', 'f2-pearl', 'f3-shell', 'f4-laser', 'f5-matte',
                         'f6-tortoise', 'f7-white', 'f8-clear', 'f9-eco', 'f10-gold'];
        featured.forEach(name => {
            createImageTest(`/images/products/${name}.webp`, name,
                          document.getElementById('featured'));
        });

        // Numbered Products
        for (let i = 1; i <= 25; i++) {
            createImageTest(`/images/products/${i}.webp`, `产品${i}`,
                          document.getElementById('numbered'));
        }

        // Brands
        const brands = ['zara', 'hm', 'uniqlo', 'tommy', 'gu'];
        brands.forEach(name => {
            createImageTest(`/images/brands/${name}.webp`, name,
                          document.getElementById('brands'));
        });

        // SVG Brands
        ['ck', 'rl'].forEach(name => {
            createImageTest(`/images/brands/${name}.svg`, name,
                          document.getElementById('brands'));
        });

        // Others
        const others = [
            { src: '/images/brand/hs-logo.webp', label: 'Logo' },
            { src: '/images/hero/hero-bg.webp', label: 'Hero' },
            { src: '/images/partners/oeko.webp', label: 'OEKO' },
            { src: '/images/about/lab-1.webp', label: 'Lab1' },
            { src: '/images/about/lab-2.webp', label: 'Lab2' },
            { src: '/images/about/lab-3.webp', label: 'Lab3' },
            { src: '/images/about/lab-4.webp', label: 'Lab4' }
        ];
        others.forEach(item => {
            createImageTest(item.src, item.label, document.getElementById('others'));
        });
    </script>
</body>
</html>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="gold" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E8D5B7"/>
      <stop offset="60%" stop-color="#C9A961"/>
      <stop offset="100%" stop-color="#8C7434"/>
    </radialGradient>
    <linearGradient id="shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.25)"/>
    </linearGradient>
  </defs>
  <!-- Outer button body -->
  <circle cx="32" cy="32" r="28" fill="url(#gold)" stroke="#8C7434" stroke-width="1.5"/>
  <!-- Inner ring -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#8C7434" stroke-width="0.8" opacity="0.6"/>
  <!-- 4 button holes -->
  <circle cx="24" cy="24" r="3" fill="#5C4A1E"/>
  <circle cx="40" cy="24" r="3" fill="#5C4A1E"/>
  <circle cx="24" cy="40" r="3" fill="#5C4A1E"/>
  <circle cx="40" cy="40" r="3" fill="#5C4A1E"/>
  <!-- Highlight shine -->
  <ellipse cx="24" cy="18" rx="10" ry="5" fill="rgba(255,255,255,0.35)"/>
  <!-- Subtle bottom shadow -->
  <ellipse cx="32" cy="56" rx="20" ry="3" fill="url(#shadow)"/>
</svg>
